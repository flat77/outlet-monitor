name: Outlet Monitor

on:
  schedule:
    # Körs var 5:e minut
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Ger Actions tillåtelse att spara ändringar i repositoryt
permissions:
  contents: write

jobs:
  check-outlet:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Konfigurera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Kör skriptet
        env:
          PUSHBULLET_TOKEN: ${{ secrets.PUSHBULLET_TOKEN }}
        run: |
          python main.py

      - name: Spara sedda produkter till GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_products.json || true
          git commit -m "Uppdatera sedda produkter" || exit 0
          git push
